    <!-- Aplica o tema antes do React carregar, para a página não piscar no tema errado -->
    <script>
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("vhgx-theme") || theme;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
